name: Build Windows installer
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build self-extracting Evergreen installer
        shell: pwsh
        run: ./launcher/Build-Package.ps1 -OutputDirectory "${{ runner.temp }}/installer"
      - uses: actions/upload-artifact@v4
        with:
          name: StarGateWebView-windows-x64
          path: ${{ runner.temp }}/installer/*.exe
